<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Library</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="library-container">
        <header class="header">
            <h1>My library</h1>
            <p>Manage and view your registered videogames</p>
        </header>

        <section class="search-container">
            <input
                type="text"
                class="search-box"
                placeholder="Search by Id..."
            >
        </section>

        <section class="games-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Hours</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="game_id" class="game-id"></td>
                        <td id="game_name" class="game-name"></td>
                        <td id="game_hours" class="hours"></td>
                        <td>
                            <span id="game_completed" class="status completed">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div id="query_game" class="empty-message">
            </div>
        </section>

        <div class="actions">
            <button class="btn btn-register">
                + Registrar juego
            </button>

            <button class="btn btn-delete">
                Eliminar juego
            </button>
        </div>
    </main>
</body>
</html>
